name: Public shadow build
run-name: Shadow build ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Public run correlation ID
        type: string
        required: true
      request:
        description: Approved public source revisions and output recipient
        type: string
        required: true

permissions:
  contents: read

jobs:
  request:
    if: github.repository == 'haiven-dev/haiven-sdk-cpp' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    outputs:
      repository: ${{ steps.plan.outputs.repository }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      dotnet_sha: ${{ steps.plan.outputs.dotnet_sha }}
      target: ${{ steps.plan.outputs.target }}
      request_id: ${{ steps.plan.outputs.request_id }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - id: plan
        name: Validate the public source request
        env:
          SHADOW_REQUEST: ${{ inputs.request }}
          DISPLAY_ID: ${{ inputs.request_id }}
        shell: bash
        run: |
          [[ "$DISPLAY_ID" == "$(jq -r .request_id <<< "$SHADOW_REQUEST")" ]]
          python .github/shadow-build/build.py plan

  build:
    name: Shadow build / ${{ matrix.platform }}
    needs: request
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.request.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ needs.request.outputs.repository }}
          ref: ${{ needs.request.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.request.outputs.dotnet_sha != ''
        with:
          repository: haiven-dev/haiven-sdk-dotnet
          ref: ${{ needs.request.outputs.dotnet_sha }}
          path: haiven-sdk-dotnet
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: needs.request.outputs.target == 'dotnet' || needs.request.outputs.dotnet_sha != ''
        with:
          global-json-file: ${{ needs.request.outputs.target == 'dotnet' && 'source/global.json' || 'haiven-sdk-dotnet/global.json' }}
      - name: Install pinned artifact encryption
        shell: bash
        run: go install filippo.io/age/cmd/age@v1.3.2
      - id: build
        name: Build and seal results
        env:
          SHADOW_REQUEST: ${{ inputs.request }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          go_bin="$(go env GOPATH)/bin"
          export PATH="$go_bin:$PATH"
          python .github/shadow-build/build.py build --platform "$PLATFORM" --source source \
            --dotnet haiven-sdk-dotnet --work "$RUNNER_TEMP/shadow-build" --bundle "$RUNNER_TEMP/build.age"
      - name: Retain encrypted results
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shadow-${{ needs.request.outputs.request_id }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/build.age
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
